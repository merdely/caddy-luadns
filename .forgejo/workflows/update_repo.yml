name: Update Docker Image from Sources

# This workflow file attempts to determine the latest versions of software
# for this container and trigger a build if it is out of date
# To use this workflow file, rename it from update_repo.yml.txt to update_repo.yml

on:
  schedule:
    - cron: '43 8 * * *'   # 04:43 ET daily (ZULU - 4)
  workflow_dispatch:       # allow manual trigger
    inputs:
      test_mode:
        description: 'Test mode'
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history + all tags

      - name: Install prerequisites
        run: |
          # [ "${{inputs.test_mode}}" != "false" ] && set -x
          # Install skopeo and any other prerequisites from CONTAINER_APT_PACKAGES variable
          echo "Installing: skopeo ${{vars.CONTAINER_APT_PACKAGES}}"
          [ "${{inputs.test_mode}}" != "false" ] && echo running sudo apt-get update -y
          sudo apt-get update -y
          [ "${{inputs.test_mode}}" != "false" ] && echo running sudo apt-get install -y skopeo ${{vars.CONTAINER_APT_PACKAGES}}
          sudo apt-get install -y skopeo ${{vars.CONTAINER_APT_PACKAGES}}

      - name: Get Repo Versions
        id: repo_versions
        run: |
          # [ "${{inputs.test_mode}}" != "false" ] && set -x
          # Define which Source Control Management tool in use
          scm=GitHub
          [ -n "$GITEA_ACTIONS" ] && scm=Gitea
          [ -n "$FORGEJO_ACTIONS" ] && scm=Forgejo
          echo "scm=$scm" | tee -a "$GITHUB_ENV"

          # Define the repo name from the repository variable (owner/repo)
          repo_name=${{github.repository}}
          repo_name=${repo_name##*/}
          echo "repo_name=$repo_name" | tee -a "$GITHUB_ENV"

          # Add container to sw_list and get its version from Dockerfile
          sw_list="container"
          if [ -r "$workflow_dir"/container_version.sh ]; then
            echo "Executing $workflow_dir/container_version.sh"
            . "$workflow_dir"/container_version.sh
          else
            container_version=$(awk -F= '/^ARG CONTAINER_VERSION=/{print $2;exit}' Dockerfile)
          fi
          echo "container_version=$container_version" | tee -a "$GITHUB_ENV"

          # Only perform actions if container_version is defined
          if [ -n "$container_version" ]; then
            # Determine the directory of the workflow files
            workflow_dir=$GITHUB_WORKSPACE/.github/workflows
            case "${scm,,}" in
              gitea)
                if [ -d "$GITHUB_WORKSPACE"/.gitea/workflows ]; then
                  workflow_dir=$GITHUB_WORKSPACE/.gitea/workflows
                fi ;;
              forgejo)
                if [ -d "$GITHUB_WORKSPACE"/.forgejo/workflows ]; then
                  workflow_dir=$GITHUB_WORKSPACE/.forgejo/workflows
                elif [ -d "$GITHUB_WORKSPACE"/.gitea/workflows ]; then
                  workflow_dir=$GITHUB_WORKSPACE/.gitea/workflows
                fi ;;
            esac
            echo "workflow_dir=$workflow_dir" >> "$GITHUB_ENV"

            # If a script to check other versions exist, run it in this environment
            if [ -r "$workflow_dir"/other_container_version.sh ]; then
              echo "Executing $workflow_dir/other_container_version.sh"
              . "$workflow_dir"/other_container_version.sh
            fi

            echo "sw_list=${sw_list# }" | tee -a "$GITHUB_ENV"
          else
            echo "Could not determine container_version, so bailing"
            false
            exit 1
          fi

      - name: Get Latest Versions
        id: latest_versions
        run: |
          # [ "${{inputs.test_mode}}" != "false" ] && set -x
          if [ -n "$container_version" ]; then
            # Ability to filter results with regex
            tag_regex=${{vars.CONTAINER_TAG_REGEX}}
            if [ -z "$tag_regex" ]; then
              grep_command=("cat")
            else
              grep_command=("grep" "-E" "${tag_regex}")
            fi

            # Ability to strip text from result
            tag_strip=${{vars.CONTAINER_TAG_STRIP}}
            if [ -z "$tag_strip" ]; then
              sed_command=("cat")
            else
              sed_command=("sed" "-r" "s/${tag_strip}//")
            fi

            if [ -r "$workflow_dir"/container_latest.sh ]; then
              echo "Executing $workflow_dir/container_latest.sh"
              . "$workflow_dir"/container_latest.sh
            else
              # A framework to check the latest version with a variety of mechanisms based on the CONTAINER_REPO variable
              case "${{vars.CONTAINER_REPO}}" in
                http*codeberg.org*/releases/latest|http*code.forgejo.org*/releases/latest|http*gitea.com*/releases/latest)
                  # Check a gitea style latest release URL
                  if [ "${{inputs.test_mode}}" != "false" ]; then
                    out=$(curl -s "${{vars.CONTAINER_REPO}}") && echo out=$out
                    out=$(echo "$out" | awk -F'["/]' '{print $7;exit}') && echo out=$out
                    out=$(echo "$out" | "${grep_command[@]}") && echo out=$out
                    out=$(echo "$out" | "${sed_command[@]}") && echo out=$out
                    out=$(echo "$out" | sed 's/^v//') && echo out=$out
                  fi
                  container_latest="$(curl -s "${{vars.CONTAINER_REPO}}" | \
                    awk -F'["/]' '{print $7; exit}' | \
                    "${grep_command[@]}" | \
                    "${sed_command[@]}" | \
                    sed 's/^v//')"
                  ;;
                http*github.com*/releases/latest)
                  # Check github latest release URL
                  if [ "${{inputs.test_mode}}" != "false" ]; then
                    out=$(curl -s "${{vars.CONTAINER_REPO}}") && echo out=$out
                    out=$(echo "$out" | jq -r '.tag_name') && echo out=$out
                    out=$(echo "$out" | "${grep_command[@]}") && echo out=$out
                    out=$(echo "$out" | "${sed_command[@]}") && echo out=$out
                    out=$(echo "$out" | sed 's/^v//') && echo out=$out
                  fi
                  container_latest="$(curl -s "${{vars.CONTAINER_REPO}}" | \
                    jq -r '.tag_name' | \
                    "${grep_command[@]}" | \
                    "${sed_command[@]}" | \
                    sed 's/^v//')"
                  ;;
                http*github.com*/releases|http*gitlab.com*/releases)
                  # Check github/gitlab releases URL
                  if [ "${{inputs.test_mode}}" != "false" ]; then
                    out=$(curl -s "${{vars.CONTAINER_REPO}}") && echo out=$out
                    out=$(echo "$out" | jq -r '.[].tag_name') && echo out=$out
                    out=$(echo "$out" | "${grep_command[@]}") && echo out=$out
                    out=$(echo "$out" | sort -Vr) && echo out=$out
                    out=$(echo "$out" | head -n1) && echo out=$out
                    out=$(echo "$out" | "${sed_command[@]}") && echo out=$out
                    out=$(echo "$out" | sed 's/^v//') && echo out=$out
                  fi
                  container_latest="$(curl -s "${{vars.CONTAINER_REPO}}" | \
                    jq -r '.[].tag_name' | \
                    "${grep_command[@]}" | \
                    sort -Vr | \
                    head -n1 | \
                    "${sed_command[@]}" | \
                    sed 's/^v//')"
                  ;;
                http*github.com*/tags|http*gitlab.com*/repository/tags)
                  # Check github/gitlab tags URL
                  if [ "${{inputs.test_mode}}" != "false" ]; then
                    out=$(curl -s "${{vars.CONTAINER_REPO}}") && echo out=$out
                    out=$(echo "$out" | jq -r '.[].name') && echo out=$out
                    out=$(echo "$out" | "${grep_command[@]}") && echo out=$out
                    out=$(echo "$out" | sort -Vr) && echo out=$out
                    out=$(echo "$out" | head -n1) && echo out=$out
                    out=$(echo "$out" | "${sed_command[@]}") && echo out=$out
                    out=$(echo "$out" | sed 's/^v//') && echo out=$out
                  fi
                  container_latest="$(curl -s "${{vars.CONTAINER_REPO}}" | \
                    jq -r '.[].name' | \
                    "${grep_command[@]}" | \
                    sort -Vr | \
                    head -n1 | \
                    "${sed_command[@]}" | \
                    sed 's/^v//')"
                  ;;
                docker://*)
                  # Use skopeo to get docker tags
                  if [ "${{inputs.test_mode}}" != "false" ]; then
                    out=$(skopeo list-tags "${{vars.CONTAINER_REPO}}") && echo out=$out
                    out=$(echo "$out" | jq -r '.Tags[]') && echo out=$out
                    out=$(echo "$out" | "${grep_command[@]}") && echo out=$out
                    out=$(echo "$out" | sort -Vr) && echo out=$out
                    out=$(echo "$out" | head -n1) && echo out=$out
                    out=$(echo "$out" | "${sed_command[@]}") && echo out=$out
                    out=$(echo "$out" | sed 's/^v//') && echo out=$out
                  fi
                  container_latest="$(skopeo list-tags "${{vars.CONTAINER_REPO}}" | \
                    jq -r '.Tags[]' | \
                    "${grep_command[@]}" | \
                    sort -Vr | \
                    head -n1 | \
                    "${sed_command[@]}" | \
                    sed 's/^v//')"
                  ;;
                *)
                  # Assume without a CONTAINER_REPO variable that we are looking for
                  # the latest GitHub release for repo/repo
                  if [ "${{inputs.test_mode}}" != "false" ]; then
                    out=$(curl -s "${{vars.CONTAINER_REPO}}") && echo out=$out
                    out=$(echo "$out" | jq -r '.tag_name') && echo out=$out
                    out=$(echo "$out" | "${grep_command[@]}") && echo out=$out
                    out=$(echo "$out" | "${sed_command[@]}") && echo out=$out
                    out=$(echo "$out" | sed 's/^v//') && echo out=$out
                  fi
                  container_latest="$(curl -s "https://api.github.com/repos/$repo_name/$repo_name/releases/latest" | \
                    jq -r '.tag_name' | \
                    "${grep_command[@]}" | \
                    "${sed_command[@]}" | \
                    sed 's/^v//')"
                  ;;
              esac
            fi
            echo "container_latest=$container_latest" | tee -a "$GITHUB_ENV"

            if [ -n "$container_latest" ]; then
              # If a script to check other latest versions exist, run it in this environment
              if [ -r "$workflow_dir"/other_container_latest.sh ]; then
                echo "Executing $workflow_dir/other_container_latest.sh"
                . "$workflow_dir"/other_container_latest.sh
              fi
            else
              echo "Could not determine container_latest, so bailing"
              false
              exit 1
            fi
          else
            echo "Could not determine container_version, so bailing"
            false
            exit 1
          fi

      - name: Update Repo if necessary
        run: |
          if [ -n "$container_latest" ]; then
            tmp_msg=()

            # [ "${{inputs.test_mode}}" != "false" ] && set -x
            # Loop through software list comparing versions
            for sw in $sw_list; do
              [ "${{inputs.test_mode}}" != "false" ] && echo "Comparing versions for $sw"
              cur_var="${sw}_version"
              latest_var="${sw}_latest"
              cur="${!cur_var:-0}"
              latest="${!latest_var:-0}"
              name=$sw
              [ $sw = container ] && name=$repo_name

              # Compare versions, if different, update Dockerfile and add a commit message
              if [ "$cur" != "$latest" ]; then
                echo "Updating $name version from $cur to $latest"
                echo sed -ri".pre_$sw" "s/^(ARG ${sw^^}_VERSION)=$cur/\1=$latest/" Dockerfile
                sed -ri".pre_$sw" "s/^(ARG ${sw^^}_VERSION)=$cur/\1=$latest/" Dockerfile
                tmp_msg+=("Update $name to $latest")
              else
                [ "${{inputs.test_mode}}" != "false" ] && echo "Both versions for $name are $latest"
              fi
            done

            # If there are any defined commit messages
            if [ ${#tmp_msg[@]} -gt 0 ]; then
              echo "'git diff' output:"
              git diff
              echo

              # Combine commit messages into a array to be used with the git command below
              commit_msg=(-m "Updating ${{github.repository}} $container_latest")
              for msg in "${tmp_msg[@]}"; do
                commit_msg+=(-m "$msg")
              done

              # Configure Git
              git config user.name "$scm Sync Bot"
              IFS=/ read -ra parts <<< "${{env.GITHUB_SERVER_URL}}"
              proto=${parts[0]}
              server=${parts[2]}
              git config user.email "${{vars.REPOS_PUSH_USER}}@${scm}_server"
              git remote set-url origin "${proto}//x-token:${{secrets.REPOS_PUSH_TOKEN}}@${server}/${{github.repository}}.git"

              if [ "${{inputs.test_mode}}" != "false" ]; then
                echo
                echo [test_mode] git commit -a "${commit_msg[@]}"
                echo [test_mode] git tag -f -a "v$container_latest" -m "v$container_latest"
                echo [test_mode] git push origin HEAD
                echo [test_mode] git push -f origin "v$container_latest"
                echo
                echo [test_mode] curl -s -X POST \
                  -H "Authorization: token ${{secrets.REPOS_PUSH_TOKEN}}" \
                  -H "Content-Type: application/json" \
                  "${proto}//${server}/api/v1/repos/${{github.repository}}/actions/workflows/build.yml/dispatches" \
                  -d "{\"ref\":\"refs/tags/v$container_latest\"}"
                if [ "${{vars.EMAIL_NOTIFICATION}}" = 'true' ]; then
                  emailfile=$(mktemp)
                  echo "From: $scm Sync Bot <root@erdelynet.com>" > "$emailfile"
                  echo "To: Michael Erdely <mike@erdelynet.com>" >> "$emailfile"
                  echo "Subject: [$scm Actions] Updating ${{github.repository}} $container_latest" >> "$emailfile"
                  echo "Date: $(date +"%a, %m %b %Y %H:%M:%S")" >> "$emailfile"
                  echo >> "$emailfile"
                  echo "${{github.repository}} was updated from $container_version to $container_latest" >> "$emailfile"
                  echo "A build of the docker container was attempted" >> "$emailfile"
                  echo >> "$emailfile"

                  echo [test_mode] curl --ssl-reqd smtp://smtp.erdely.in:587 \
                    --mail-from root@erdelynet.com \
                    --mail-rcpt mike@erdelynet.com --upload-file "$emailfile"
                  echo
                  sed 's/^/[test_mode] /' "$emailfile"
                  rm -f "$emailfile"
                fi
              else
                # Commit to Git
                git commit -a "${commit_msg[@]}"
                # Commit tag (with force in case updating)
                git tag -f -a "v$container_latest" -m "v$container_latest"
                # Push the HEAD
                git push origin HEAD
                # Push the tag
                git push -f origin "v$container_latest"

                # Trigger the build (this SHOULD happen automatically)
                echo "Triggering build for $repo_name"
                curl -s -X POST \
                  -H "Authorization: token ${{secrets.REPOS_PUSH_TOKEN}}" \
                  -H "Content-Type: application/json" \
                  "${proto}//${server}/api/v1/repos/${{github.repository}}/actions/workflows/build.yml/dispatches" \
                  -d "{\"ref\":\"refs/tags/v$container_latest\"}"

                # Send email notification
                if [ "${{vars.EMAIL_NOTIFICATION}}" = 'true' ]; then
                  emailfile=$(mktemp)
                  echo "From: $scm Sync Bot <root@erdelynet.com>" > "$emailfile"
                  echo "To: Michael Erdely <mike@erdelynet.com>" >> "$emailfile"
                  echo "Subject: [$scm Actions] Updating ${{github.repository}} $container_latest" >> "$emailfile"
                  echo "Date: $(date +"%a, %m %b %Y %H:%M:%S")" >> "$emailfile"
                  echo >> "$emailfile"
                  echo "${{github.repository}} was updated from $container_version to $container_latest" >> "$emailfile"
                  echo "A build of the docker container was attempted" >> "$emailfile"
                  echo >> "$emailfile"

                  curl --ssl-reqd smtp://smtp.erdely.in:587 \
                    --mail-from root@erdelynet.com \
                    --mail-rcpt mike@erdelynet.com --upload-file "$emailfile"
                  rm -f "$emailfile"
                fi
              fi
            else
              echo "No need to update $repo_name"
            fi
          else
            echo "Could not determine container_latest, so bailing"
            false
            exit 1
          fi

