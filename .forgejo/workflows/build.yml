name: Container Build Action

on:
  push:
    # branches:
    #   - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu
    steps:
      - name: Build Container
        uses: docker/container-build@main
        with:
          registry: ${{ vars.REGISTRY || 'src.erdely.in' }}
          platforms: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
          username: ${{ vars.PACKAGE_UPLOAD_USER || github.actor }}
          password: ${{ secrets.PACKAGE_UPLOAD_TOKEN || secrets.PUSH_TOKEN }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
          email_notification: ${{ vars.EMAIL_NOTIFICATION || 'true' }}
          smtp_server: ${{ vars.SMTP_SERVER || 'smtp.erdely.in:587' }}
          smtp_to_address: ${{ vars.SMTP_TO_ADDRESS || 'mike@erdelynet.com' }}
          smtp_to_name: ${{ vars.SMTP_TO_NAME || 'Michael Erdely' }}
          smtp_from_address: ${{ vars.SMTP_FROM_ADDRESS || 'git@erdelynet.com' }}
          smtp_username: ${{ vars.SMTP_USERNAME || 'forgejo_actions' }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          smtp_ssl: ${{ vars.SMTP_SSL  || 'true' }}
          smtp_resolve: ${{ vars.SMTP_RESOLVE || 'smtp.erdely.in:587:192.168.201.18' }}
          smtp_verbose: ${{ vars.SMTP_VERBOSE || 'false' }}

