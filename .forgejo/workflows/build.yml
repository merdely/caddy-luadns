name: Container Build Action

on:
  push:
    # branches:
    #   - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Build Action and Tags
        id: build_logic
        uses: actions/custom-build-logic@main
        with:
          platforms: ${{ vars.PLATFORMS || 'linux/amd64' }}

      - name: Login to DockerHub.Registry
        if: vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY || 'src.erdely.in' }}
          username: ${{ vars.PACKAGE_UPLOAD_USER || github.actor }}
          password: ${{ secrets.PACKAGE_UPLOAD_TOKEN || secrets.PUSH_TOKEN }}

      - name: Set up QEMU
        if: steps.build_logic.outputs.qemu_needed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: metadata
        uses: docker/custom-metadata-action@main
        with:
          flavor: latest=false
          has_tags: ${{ steps.build_logic.outputs.has_tags }}
          is_latest: ${{ steps.build_logic.outputs.is_latest }}
          registry: ${{ vars.REGISTRY || 'src.erdely.in' }}

      - name: Compute per-platform tags
        id: platform_tags
        uses: actions/custom-platform-tags@main
        with:
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Build and push (amd64)
        if: steps.build_logic.outputs.build_amd64 == 'true'
        id: build_amd64
        uses: docker/build-push-action@v7
        with:
          context: ${{ vars.CONTEXT || '.' }}
          file: ${{ vars.DOCKERFILE || './Dockerfile' }}
          push: true
          platforms: 'linux/amd64'
          tags: ${{ steps.platform_tags.outputs.amd64 }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.REGISTRY || 'src.erdely.in' }}/${{ env.GITHUB_REPOSITORY }}-cache:amd64
          cache-to:   type=registry,ref=${{ vars.REGISTRY || 'src.erdely.in' }}/${{ env.GITHUB_REPOSITORY }}-cache:amd64,mode=max

      - name: Build and push (arm64)
        if: steps.build_logic.outputs.build_arm64 == 'true'
        id: build_arm64
        uses: docker/build-push-action@v7
        with:
          context: ${{ vars.CONTEXT || '.' }}
          file: ${{ vars.DOCKERFILE || './Dockerfile' }}
          push: true
          platforms: 'linux/arm64'
          tags: ${{ steps.platform_tags.outputs.arm64 }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.REGISTRY || 'src.erdely.in' }}/${{ env.GITHUB_REPOSITORY }}-cache:arm64
          cache-to:   type=registry,ref=${{ vars.REGISTRY || 'src.erdely.in' }}/${{ env.GITHUB_REPOSITORY }}-cache:arm64,mode=max

      - name: Create multi-arch manifest
        id: manifest
        uses: docker/custom-create-manifest@main
        with:
          tags: ${{ steps.metadata.outputs.tags }}
          build_amd64: ${{ steps.build_logic.outputs.build_amd64 }}
          build_arm64: ${{ steps.build_logic.outputs.build_arm64 }}

      - name: Determine Build Status for Email
        id: email_info
        uses: docker/custom-gen-build-email@main
        with:
          build_logic_outcome: ${{ steps.build_logic.outcome }}
          build_amd64_outcome: ${{ steps.build_amd64.outcome }}
          build_arm64_outcome: ${{ steps.build_arm64.outcome }}
          manifest_outcome: ${{ steps.manifest.outcome }}
          platforms: ${{ steps.build_logic.outputs.platforms }}
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Send Email Notification
        id: send_email
        uses: actions/custom-send-email@main
        with:
          email_notification: ${{ vars.EMAIL_NOTIFICATION || 'true' }}
          smtp_server: ${{ vars.SMTP_SERVER || 'smtp.erdely.in:587' }}
          subject: ${{ steps.email_info.outputs.subject }}
          message_body: ${{ steps.email_info.outputs.message_body }}
          smtp_to_address: ${{ vars.SMTP_TO_ADDRESS || 'mike@erdelynet.com' }}
          smtp_to_name: ${{ vars.SMTP_TO_NAME || 'Michael Erdely' }}
          smtp_from_address: ${{ vars.SMTP_FROM_ADDRESS || 'git@erdelynet.com' }}
          smtp_ssl: ${{ vars.SMTP_SSL || 'true' }}
          smtp_username: ${{ vars.SMTP_USERNAME || 'forgejo_actions' }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          smtp_resolve: ${{ vars.SMTP_RESOLVE }}
          smtp_verbose: ${{ vars.SMTP_VERBOSE || 'false' }}

      # --- Docker Hub (only when repo variable DOCKERHUB_PUSH is exactly "true") ---
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_PUSH == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        if: ${{ vars.DOCKERHUB_PUSH == 'true' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            TAG=latest
          else
            # Docker tags allow only [A-Za-z0-9_.-], max 128 chars, can't start with . or -
            TAG=$(printf '%s' "$BRANCH" | sed -e 's/[^A-Za-z0-9_.-]/-/g' -e 's/^[.-]*//' | cut -c1-128)
          fi
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Copy image to Docker Hub
        if: ${{ vars.DOCKERHUB_PUSH == 'true' }}
        env:
          SRC_IMAGE: src.erdely.in/docker/archshell    # your existing Forgejo image
          DST_IMAGE: docker.io/merdely/archshell       # Docker Hub repo
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${DST_IMAGE}:${TAG}" \
            "${SRC_IMAGE}:${TAG}"
